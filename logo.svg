<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ThinkLoop logo — an audiogram waveform inside a loop">
  <title>ThinkLoop</title>
  <desc>A loop formed by an audiogram waveform: the feedback loop between medicine and machine intelligence.</desc>

  <!-- The Loop: outer ring in deep medical navy -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#1B2A4A" stroke-width="24"/>

  <!-- Gold arc accent: the loop is open at the top, echoing the "loop" glyph -->
  <path d="M 256 56 A 200 200 0 0 1 431 132" fill="none" stroke="#D4A843" stroke-width="24" stroke-linecap="round"/>

  <!-- Audiogram waveform: hearing thresholds worsening across frequency (staircase) -->
  <path d="M 118 170 L 198 170 L 198 224 L 278 224 L 278 278 L 358 278 L 358 332"
        fill="none" stroke="#2A9D8F" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Audiogram O-markers (gold rings) at each plotted frequency -->
  <circle cx="118" cy="170" r="13" fill="none" stroke="#D4A843" stroke-width="8"/>
  <circle cx="198" cy="224" r="13" fill="none" stroke="#D4A843" stroke-width="8"/>
  <circle cx="278" cy="278" r="13" fill="none" stroke="#D4A843" stroke-width="8"/>

  <!-- Data node: the gold dot that completes the loop -->
  <circle cx="358" cy="332" r="16" fill="#D4A843"/>
</svg>
